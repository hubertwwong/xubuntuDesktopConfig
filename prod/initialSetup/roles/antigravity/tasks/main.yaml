---
- name: Antigravity - Ensure global configuration directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ ansible_env.HOME }}/.gemini"
    - "{{ ansible_env.HOME }}/.gemini/config"
    - "{{ ansible_env.HOME }}/.gemini/config/skills"
    - "{{ ansible_env.HOME }}/.gemini/config/plugins"
    - "{{ ansible_env.HOME }}/.gemini/config/agents"

- name: Antigravity - Deploy global agent config.json
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../dotfiles/gemini/config.json"
    dest: "{{ ansible_env.HOME }}/.gemini/config/config.json"
    mode: '0600'

- name: Antigravity - Deploy global agent mcp_config.json
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../dotfiles/gemini/mcp_config.json"
    dest: "{{ ansible_env.HOME }}/.gemini/config/mcp_config.json"
    mode: '0644'

- name: Antigravity - Deploy global AGENTS.md rules
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../dotfiles/gemini/AGENTS.md"
    dest: "{{ ansible_env.HOME }}/.gemini/config/AGENTS.md"
    mode: '0644'

- name: Antigravity - Deploy custom agent definitions
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../dotfiles/gemini/agents/"
    dest: "{{ ansible_env.HOME }}/.gemini/config/agents/"
    mode: '0644'
