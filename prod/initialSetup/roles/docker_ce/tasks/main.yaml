- name: Install prereq packages for podman
  ansible.builtin.package:
    name: 
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg-agent
      - software-properties-common
    state: present
  become: yes

- name: Ensure keyring directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  become: yes

- name: Download Docker GPG key
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
  become: yes

- name: Add docker repo
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable"
    state: present
    update_cache: yes
  become: yes

- name: Install docker and docker compose
  ansible.builtin.package:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose
    state: present
  become: yes

# TODO: Probably add a dependency check to see if docker exist before doing anything.
# I wonder if this will just fail if docker not install. Then no checking is really needed..

- name: Enable docker service
  systemd:
    name: docker
    enabled: yes
    state: started
  become: yes

- name: Add current user to docker group
  user:
    name: "{{ansible_env.USER}}"
    groups: docker
    append: yes
  become: yes

