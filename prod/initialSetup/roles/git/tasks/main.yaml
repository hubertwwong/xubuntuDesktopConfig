- name: Install git
  ansible.builtin.package:
    name: 
      - git
    state: present
  become: yes

- name: Update git name
  community.general.git_config:
    name: user.name
    value: "{{ git_name }}"
    scope: global
  when: git_name != ""

- name: Update git email address
  community.general.git_config:
    name: user.email
    value: "{{ git_email }}"
    scope: global
  when: git_email != ""

- name: Update git credential helper cache
  community.general.git_config:
    name: credential.helper
    value: cache
    scope: global

- name: Set timeout for git cache for 1 year
  community.general.git_config:
    name: credential.helper
    value: "cache --timeout=3153600000"
    scope: global